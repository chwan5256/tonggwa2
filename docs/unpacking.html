<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>성취기준 언패킹 · 통합과학2 교사용</title>
<script src="teacher-only.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F7F5F1; --surface:#FFFFFF; --surface-2:#F1EEE8;
  --ink:#191E22; --ink-soft:#5C646C; --ink-faint:#8A9299;
  --rule:#DFD9CF; --rule-soft:#EBE6DE;
  --accent:#1D5E6B; --accent-hi:#14464F; --accent-wash:#E4EEEF;
  --ochre:#916027; --ochre-wash:#F3EADC;
  --danger:#A03A29; --danger-wash:#F6E7E3;
  --shadow:0 1px 2px rgba(25,30,34,.05), 0 8px 24px -12px rgba(25,30,34,.18);
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  --serif:"Gowun Batang","IBM Plex Sans KR",Georgia,serif;
  --lvA:#1D5E6B; --lvB:#3A7F87; --lvC:#916027; --lvD:#A5764A; --lvE:#8A9299;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#131719; --surface:#1A1F22; --surface-2:#20262A;
  --ink:#E9E6E0; --ink-soft:#A0A8AE; --ink-faint:#767E85;
  --rule:#2C3439; --rule-soft:#242B30;
  --accent:#63B4C0; --accent-hi:#8ACDD7; --accent-wash:#16323A;
  --ochre:#C99C5C; --ochre-wash:#2C2519;
  --danger:#D9755F; --danger-wash:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --lvA:#63B4C0; --lvB:#4E959F; --lvC:#C99C5C; --lvD:#A5804F; --lvE:#767E85;
}}
:root[data-theme="dark"]{
  --ground:#131719; --surface:#1A1F22; --surface-2:#20262A;
  --ink:#E9E6E0; --ink-soft:#A0A8AE; --ink-faint:#767E85;
  --rule:#2C3439; --rule-soft:#242B30;
  --accent:#63B4C0; --accent-hi:#8ACDD7; --accent-wash:#16323A;
  --ochre:#C99C5C; --ochre-wash:#2C2519;
  --danger:#D9755F; --danger-wash:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --lvA:#63B4C0; --lvB:#4E959F; --lvC:#C99C5C; --lvD:#A5804F; --lvE:#767E85;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.72;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header.mast{border-bottom:1px solid var(--rule);background:linear-gradient(180deg,var(--surface),var(--ground))}
header.mast .wrap{padding:42px 24px 30px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin:0 0 13px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.3vw,42px);line-height:1.24;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
.dek{margin:0;max-width:64ch;color:var(--ink-soft);font-size:16px;font-weight:300}
.meta{display:flex;flex-wrap:wrap;gap:9px 22px;margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.meta b{color:var(--ink-soft);font-weight:500}

nav.tabs{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{appearance:none;background:none;border:0;cursor:pointer;font-family:var(--sans);
  font-size:13.5px;font-weight:500;color:var(--ink-soft);padding:14px 14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button .c{font-family:var(--mono);font-size:12px;opacity:.75;margin-right:6px}
.tt{margin-left:auto;align-self:center}
.tt button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:999px;padding:6px 13px;background:var(--surface);color:var(--ink-soft);cursor:pointer}

main{padding:38px 0 100px}
.panel{display:none}.panel.on{display:block}

h2.sec{font-family:var(--mono);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ochre);margin:52px 0 16px;padding-bottom:9px;border-bottom:1px solid var(--rule-soft);
  display:flex;align-items:baseline;gap:10px}
h2.sec:first-of-type{margin-top:0}
h2.sec .n{color:var(--ink-faint);font-size:11px}
h3.sub{font-size:16px;font-weight:600;margin:26px 0 10px}

/* standard header card */
.stdcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px 26px;box-shadow:var(--shadow);margin-bottom:8px}
.stdcard .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.code{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--surface);background:var(--accent);padding:4px 11px;border-radius:6px}
:root[data-theme="dark"] .code,:root:not([data-theme="light"]) .code{color:#0F1416}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .code{color:#fff}}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:999px;padding:4px 11px}
.stdcard .txt{font-family:var(--serif);font-size:19px;line-height:1.66;margin:0;color:var(--ink);text-wrap:pretty}

/* three-category */
.cat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.catbox{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.catbox h4{margin:0 0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
.catbox ul{margin:0;padding-left:17px}
.catbox li{margin:0 0 9px;font-size:14px;line-height:1.62;color:var(--ink-soft)}
.catbox li b{color:var(--ink);font-weight:600}
.catbox .fn{font-family:var(--mono);font-size:11px;color:var(--accent);margin-right:5px}
.obs{display:block;margin-top:4px;font-size:12.5px;color:var(--ink-faint);font-style:normal;padding-left:9px;border-left:2px solid var(--rule)}

/* levels table */
.lvtbl{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:var(--surface-2);font-weight:500;white-space:nowrap}
tr:last-child td{border-bottom:0}
td b{font-weight:600;color:var(--ink)}
.lvcell{font-family:var(--mono);font-weight:500;font-size:15px;width:48px;text-align:center}
.lv-A{color:var(--lvA)}.lv-B{color:var(--lvB)}.lv-C{color:var(--lvC)}.lv-D{color:var(--lvD)}.lv-E{color:var(--lvE)}
tr.merged td{color:var(--ink-faint);font-size:12.5px;font-style:italic}

/* ladder */
.ladder{display:grid;gap:0;margin-top:6px}
.rung{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;position:relative}
.rung::before{content:"";position:absolute;left:47px;top:36px;bottom:0;width:1px;background:var(--rule)}
.rung:last-child::before{display:none}
.rung .step{font-family:var(--mono);font-size:11.5px;font-weight:500;height:36px;display:grid;place-items:center;
  border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--accent);z-index:1;letter-spacing:.02em}
.rung .b{padding:2px 0 26px}
.rung .add{font-size:15px;font-weight:600;margin:5px 0 5px}
.rung .why{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.62;max-width:62ch}
.rung .why b{color:var(--ink)}
.rung .probe{margin:9px 0 0;font-size:13.5px;color:var(--ink-soft);background:var(--accent-wash);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:9px 14px;max-width:62ch}
.rung .probe::before{content:"확인 발문 ";font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}

.keyA{border-left:3px solid var(--ochre);background:var(--ochre-wash);padding:15px 19px;border-radius:0 8px 8px 0;margin:22px 0 0;font-size:14.5px;color:var(--ink-soft);line-height:1.68}
.keyA b{color:var(--ink)}
.keyA::before{content:"A 판정의 결정적 표지";font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);display:block;margin-bottom:6px}

.warn{border-left:3px solid var(--danger);background:var(--danger-wash);padding:15px 19px;border-radius:0 8px 8px 0;margin:18px 0;font-size:14.5px;color:var(--ink-soft);line-height:1.68}
.warn b{color:var(--ink)}
.warn::before{content:"주의";font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--danger);display:block;margin-bottom:6px}

/* misconceptions */
.mis{display:grid;gap:14px}
.miscard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.miscard .m{padding:14px 20px;background:var(--danger-wash);border-bottom:1px solid var(--rule-soft);
  font-size:15px;font-weight:600;color:var(--ink);display:flex;gap:10px;align-items:baseline}
.miscard .m::before{content:"✕";color:var(--danger);font-family:var(--mono);font-size:13px;flex:none}
.miscard .g{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:760px){.miscard .g{grid-template-columns:1fr}}
.miscard .g > div{padding:15px 20px;font-size:14px;line-height:1.64;color:var(--ink-soft)}
.miscard .g > div:first-child{border-right:1px solid var(--rule-soft)}
@media(max-width:760px){.miscard .g > div:first-child{border-right:0;border-bottom:1px solid var(--rule-soft)}}
.miscard .g b{color:var(--ink)}
.miscard .g h5{margin:0 0 7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

/* essential questions */
.eq{display:grid;gap:12px;counter-reset:q}
.eqi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 20px 16px 54px;position:relative;
  font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--ink)}
.eqi::before{counter-increment:q;content:"Q" counter(q);position:absolute;left:20px;top:17px;
  font-family:var(--mono);font-size:12px;color:var(--ochre);font-style:normal}

/* tool box */
.toolbox{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.toolbox .hd{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
.toolbox .tid{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:3px 10px}
.toolbox p{margin:0;font-size:14.5px;color:var(--ink-soft);line-height:1.66}
.toolbox p b{color:var(--ink)}
.sn{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule-soft);font-size:14px;color:var(--ink-soft)}
.sn::before{content:"2028 수능 연계";font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre);display:block;margin-bottom:5px}
.sn b{color:var(--ink)}

/* overview */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.ocard{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.ocard h4{margin:0 0 10px;font-size:15.5px;font-weight:600}
.ocard p{margin:0 0 10px;font-size:14px;color:var(--ink-soft);line-height:1.64}
.ocard p:last-child{margin-bottom:0}
.ocard b{color:var(--ink)}
.axis{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:baseline;margin-top:4px}
.axis dt{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
.axis dd{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.axis dd b{color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* 교사 화면과 잇는 위쪽 막대 (tonggwa2 v0.12.0) */
.dtop{background:var(--surface);border-bottom:1px solid var(--rule);font-size:13.5px}
.dtop .wrap{display:flex;gap:18px;align-items:center;height:44px}
.dtop a{color:var(--ink-soft);text-decoration:none}
.dtop a:hover{color:var(--accent)}
.dtop .sp{flex:1}
@media print{.dtop,nav.tabs{display:none}.panel{display:block!important;page-break-before:always}}
</style>
</head>

    <h1>통합과학2 성취기준 언패킹</h1>
    <p class="dek">담당 성취기준 5개를 지식·이해 / 과정·기능 / 가치·태도로 분해하고, 성취수준 A~E를 가르는 결정적 차이와 학생 오개념, 평가요소를 정리했습니다. 모든 A~E 진술은 「2022 개정 교육과정에 따른 고등학교 과학과 공통과목 성취수준」 원문입니다.</p>

      <span><b>범위</b> 과학과 미래 사회 전체 + 지구 환경의 변화</span>
      <span><b>성취기준</b> 5개</span>
    </div>

<script>const DATA = {
"02-03": {
  code: "[10통과2-02-03]",
  area: "(2) 환경과 에너지 / 지구 환경의 변화",
  tag: "온실기체와 지구온난화",
  text: "온실효과 강화로 인한 지구온난화의 메커니즘을 이해하고, 엘니뇨, 사막화 등과 같은 현상이 지구 환경과 인간 생활에 미치는 영향과 대처 방안을 분석할 수 있다.",
  merged: false,
  cat: {
    know: [
      "온실효과는 대기 중 온실기체가 <b>지구복사(적외선)</b>를 흡수·재방출하여 지표 부근 온도를 높이는 자연 현상이다.",
      "온실기체 농도가 증가하면 온실효과가 <b>강화</b>되고, 지구는 <b>더 높은 온도에서 새로운 복사 평형</b>에 도달한다.",
      "지구 열수지: 흡수하는 태양복사(70%)와 방출하는 지구복사(70%)가 균형을 이룰 때 연평균 기온이 일정하다.",
      "엘니뇨는 무역풍 약화로 동태평양 적도 해역의 표층 수온이 상승하는 현상이며, 지역별로 가뭄·홍수 피해가 갈린다.",
      "사막화는 기후 요인과 인간 활동(과방목·삼림 벌채)이 함께 작용해 토지가 황폐해지는 과정이다.",
      "이러한 현상은 지구 환경(생태계·해수면·강수 분포)과 인간 생활(농업·보건·재해)에 서로 다른 방향의 영향을 미친다."
    ],
    skill: [
      { n: "⑤", t: "증거 기반 분석·평가·추론 — 관측 시계열(CO₂ 농도, 전지구 평균기온, 해수면 온도)에서 경향성을 읽는다." },
      { n: "⑥", t: "결론 도출 및 적용 — 열수지 개념으로 관측된 온난화를 설명하고 새로운 사례에 적용한다." },
      { n: "③", t: "디지털 도구로 정보 조사·수집·해석 — 공공 기상·해양 데이터를 직접 내려받아 처리한다." },
      { n: "⑦", t: "소통과 의사결정 — 대처 방안을 비교·평가하고 근거를 들어 선택을 주장한다." }
    ],
    value: [
      "<b>안전·지속가능 사회에 기여</b> — 지구 환경 문제에 대해 책임감을 갖고 적극적으로 대처하려 한다. <span class='obs'>관찰 지표: 대처 방안 토론에서 자신의 생활 반경 안의 실천을 구체적으로 제안하는가</span>",
      "<b>과학 유용성</b> — 기후 예측·관측 기술이 재해 대응에 쓰이는 가치를 인식한다. <span class='obs'>관찰 지표: 데이터로 예측한다는 것의 의미를 자기 말로 설명하는가</span>"
    ]
  },
  levels: [

  h+=`<h2 class="sec"><span class="n">05</span>평가요소</h2><div class="lvtbl"><table>
    <thead><tr><th>범주</th><th>내용 요소</th><th>평가 요소</th><th>적합 평가 방법</th><th>겨냥 수준</th></tr></thead>
    <tbody>${d.ev.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' style="white-space:nowrap"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  h+=`<h2 class="sec"><span class="n">06</span>핵심질문</h2><div class="eq">${d.eq.map(q=>`<div class="eqi">${q}</div>`).join('')}</div>`;

  h+=`<h2 class="sec"><span class="n">07</span>공식 예시 평가 도구</h2><div class="toolbox">
    <div class="hd"><span class="tid">${d.tool.id}</span><span class="pill">${d.tool.type}</span><span class="pill">겨냥 ${d.tool.lvl}</span><span class="pill">${d.tool.pt}</span></div>
    <p>${d.tool.note}</p>${d.suneung?`<div class="sn">${d.suneung}</div>`:''}</div>`;
  return h;

/* ---- tab switching ---- */
function sw(t){
  document.querySelectorAll('nav.tabs button[data-t]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  window.scrollTo({top:0,behavior:'instant'});
  try{localStorage.setItem('s2-tab',t);}catch(e){}
  /* 주소 뒤 #02-03 처럼 성취기준을 붙이면 그 탭이 바로 열립니다(설계 지도에서 연결). */
  history.replaceState(null,'',t==='ov'?location.pathname:'#'+t);
}
document.querySelectorAll('nav.tabs button[data-t]').forEach(b=>b.addEventListener('click',()=>sw(b.dataset.t)));

/* ---- theme ---- */
const root=document.documentElement,tb=document.getElementById('themeBtn');
function ap(v){ if(v==='system'){root.removeAttribute('data-theme');tb.textContent='시스템';}
  else{root.setAttribute('data-theme',v);tb.textContent=v==='dark'?'다크':'라이트';}
  try{localStorage.setItem('s2-theme',v);}catch(e){} }
let cur='system'; try{cur=localStorage.getItem('s2-theme')||'system';}catch(e){}
ap(cur);
tb.addEventListener('click',()=>{cur=cur==='system'?'light':cur==='light'?'dark':'system';ap(cur);});

let st='ov'; try{st=localStorage.getItem('s2-tab')||'ov';}catch(e){}
const hs=decodeURIComponent(location.hash.slice(1));
if(ORDER.includes(hs)) st=hs;
sw((st==='ov'||ORDER.includes(st))?st:'ov');
addEventListener('hashchange',()=>{const h=decodeURIComponent(location.hash.slice(1)); if(ORDER.includes(h)) sw(h);});
</script>
